name: CI/CD

on:
  push:
    branches: [ main, deploy/preprod, deploy/prod ]
  pull_request:
    branches: [ main, deploy/preprod, deploy/prod ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-mvp

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: fastapi-mvp/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/preprod' || github.ref == 'refs/heads/deploy/prod')

    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build variables
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          case "${GITHUB_REF}" in
            refs/heads/main)           echo "ENV_TAG=latest"  >> "$GITHUB_ENV" ;;
            refs/heads/deploy/preprod) echo "ENV_TAG=preprod" >> "$GITHUB_ENV" ;;
            refs/heads/deploy/prod)    echo "ENV_TAG=prod"    >> "$GITHUB_ENV" ;;
          esac

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./fastapi-mvp
          file: ./fastapi-mvp/Dockerfile
          push: true
          tags: |
            ghcr.io/whispr-messenger/moderation-service:${{ env.ENV_TAG }}
            ghcr.io/whispr-messenger/moderation-service:sha-${{ env.SHORT_SHA }}
